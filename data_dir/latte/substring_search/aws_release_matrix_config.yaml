# Where 1 to 4 characters top out, and what limits them, on a release-mode ScyllaDB.
#
# Every AWS run so far used a dev-mode ScyllaDB build (-O1), and every one put 1, 2 and 4 characters
# at 9.2-9.5k queries a second whatever the index did: those keywords match hundreds of thousands of
# names, so every query reads a full page of 20 rows from ScyllaDB (~190k rows a second), while the
# 8-32 character keywords are needles that read 1-2. This run uses a release build (LTO and the PGO
# profile, scylladb e001e1e62f) and asks:
#
# - capacity of every shape, on the corpus of names_10M_long with the query matrix of
#   derive_query_matrix.py added (names_10M_matrix): the old sets, unchanged in what they match,
#   plus short keywords with few matches (char1_rare, char2_rare, char4_rare: 1-19 names) and long
#   ones that fill a page (char8_common, char12_common: 20 or more). Read q/s together with rows a
#   query, from the dataset's expected_counts.tsv (the result_count of each row should match it);
# - whether 2 characters are saturated or latency-bound: the same set at concurrency 128 and 256;
# - the cost of a row against the cost of a query: the same set at LIMIT 1, 5 and 50;
# - where the time goes: every row carries db_reactor_busy_pct, loader_cpu_busy_pct and
#   vs_cpu_busy_pct, averaged over the phase.
#
# One index, the defaults (4 rarest grams), built while the table loads. Its accuracy is checked
# locally, not here (local_matrix_config.yaml): computing it here would spend the loader's CPU.
#
# Compare against the dev-build runs (a7be7f76's control: char1-4 at 9.2-9.5k, char8 10.6k, char16
# 6.9k, char32 7.8k, miss ~59k -- those with all grams; rarest: 12.9k, 12.2k, 15.1k). Across runs
# only a difference over ~20% means anything.
#
# Run with the case-sensitive overlay, as the earlier runs were, and the release package:
#   --config test-cases/substring-search/substring-search-test.yaml
#   --config test-cases/substring-search/stage5-case-sensitive.yaml
#   SCT_SEARCH_TEST_CONFIG=data_dir/latte/substring_search/aws_release_matrix_config.yaml
#
# Budget: provisioning ~20 min; load and ingest of one index ~25 min; 20 phases at ~1.6 min ~32 min;
# log collection and teardown ~12 min: about 1:30.
datasets:
  - name: names_10M_matrix
    index_during_load: true
    max_index_wait_secs: 7200
    max_shard_load_secs: 7200
    max_settle_secs: 1800
    index_variants:
      - label: default
        options: {}
    defaults:
      limit: 20
      duration: 60s
      concurrency: 64
      rate: 0
      expected_p99_read_ms: 100
    steps:
      - shards: [0..9]
        queries:
          # capacity, the sets the earlier runs measured
          - {set: char1, ordered: true}
          - {set: char2, ordered: true}
          - {set: char4, ordered: true}
          - {set: char8, ordered: true}
          - {set: char16, ordered: true}
          - {set: char32, ordered: true}
          - {set: miss, ordered: true}
          # capacity, the new corners: short and rare, long and common
          - {set: char1_rare, ordered: true}
          - {set: char2_rare, ordered: true}
          - {set: char4_rare, ordered: true}
          - {set: char8_common, ordered: true}
          - {set: char12_common, ordered: true}
          # saturated or latency-bound
          - {set: char2, ordered: true, concurrency: 128}
          - {set: char2, ordered: true, concurrency: 256}
          # cost of a row against cost of a query
          - {set: char2, ordered: true, limit: 1}
          - {set: char2, ordered: true, limit: 5}
          - {set: char2, ordered: true, limit: 50}
          # latency, below capacity
          - {set: char2, ordered: true, rate: 2000, concurrency: 16}
          - {set: char4, ordered: true, rate: 2000, concurrency: 16}
          - {set: char8_common, ordered: true, rate: 2000, concurrency: 16}
