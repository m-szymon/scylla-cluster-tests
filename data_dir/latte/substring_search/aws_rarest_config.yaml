# Two ways to cut what a keyword past max_gram costs the index node, on one table and in one run,
# against a control. At 10M names the index node's CPU is the limit for 8 and 16 characters (and
# close to it at 32): the walk intersects every 3-gram of the keyword in every segment that holds
# them all, and most such segments hold no match.
#
# - rarest_grams (vector-store dbbb491, scylladb 6a0b52f4bf): intersect only the 4 grams with the
#   fewest documents in each segment and let the verification drop the rest. Locally
#   (benches/pattern_probe.rs, 2M names in 200k-row segments) the walk went from 103 to 28 us at
#   16 characters and from 59 to 29 us at 32; 8 characters stayed level.
# - a larger max_gram: longer grams are rarer, so fewer segments hold all of a keyword's grams
#   without holding it. Locally max_gram 4 took 8 characters from 30 to 18 us and max_gram 5 to
#   10 us, for an index 35% and 75% larger. A keyword up to max_gram characters becomes one exact
#   lookup.
#
# Every index is built while the table loads, with the port's defaults otherwise (a 200k cap, the
# rewrite on, the node verifying). Three indexes, not more: run 4c4b7647 had six (also max_gram 4
# alone, max_gram 5 with rarest grams, and the control again at the end), and at about 5.2M names
# each the index node (c8g.xlarge, 8 GB) began to thrash -- CPU down from ~88% to ~22%, 12 GB read
# from its disk in five minutes, no status answers -- and the run was aborted. Three indexes at 10M
# is what this node carried in run 7212926d. A bigger node would hold more, but the index node's CPU
# has to stay the limit at 8 to 32 characters for the walk's cost to show.
#
# Run with the case-sensitive overlay, as the earlier runs were:
#   --config test-cases/substring-search/substring-search-test.yaml
#   --config test-cases/substring-search/stage5-case-sensitive.yaml
#   SCT_SEARCH_TEST_CONFIG=data_dir/latte/substring_search/aws_rarest_config.yaml
#
# What to read afterwards: per variant, the capacity rows at 8, 16 and 32 characters against the
# control's, the walk and segments opened per query, the size row (bytes a name), and
# 'catch_up_secs' (three indexes ingest at once, so each one's cost is not separable).
#
# Budget: provisioning ~20 min; load and ingest of three indexes ~30 min; three rounds of 14 phases
# at ~21 min; log collection and teardown ~12 min: about 2:10.
datasets:
  - name: names_10M_long
    index_during_load: true
    max_index_wait_secs: 7200
    max_shard_load_secs: 7200
    max_settle_secs: 1800
    index_variants:
      - label: control
        options: {}
      - label: rarest
        options: {rarest_grams: '4'}
      - label: gram4_rarest
        options: {max_gram: '4', rarest_grams: '4'}
    defaults:
      limit: 20
      duration: 60s
      concurrency: 64
      rate: 0
      expected_p99_read_ms: 100
    steps:
      - shards: [0..9]
        queries:
          # capacity
          - {set: char1, ordered: true}
          - {set: char2, ordered: true}
          - {set: char2, ordered: true, window: 0.5}
          - {set: char4, ordered: true}
          - {set: char8, ordered: true}
          - {set: char8, ordered: true, window: 0.5}
          - {set: char16, ordered: true}
          - {set: char32, ordered: true}
          - {set: miss, ordered: true}
          # latency, below capacity
          - {set: char2, ordered: true, rate: 2000, concurrency: 16, duration: 60s}
          - {set: char4, ordered: true, rate: 2000, concurrency: 16, duration: 60s}
          - {set: char8, ordered: true, rate: 2000, concurrency: 16, duration: 60s}
          - {set: char16, ordered: true, rate: 1000, concurrency: 16, duration: 60s}
          - {set: char32, ordered: true, rate: 500, concurrency: 16, duration: 60s}
