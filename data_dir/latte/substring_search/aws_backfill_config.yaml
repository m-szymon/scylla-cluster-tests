# The backfill half of the port's measurement, with a control. Two questions at 10M names:
#
# 1. What does an index created on an already loaded table cost and answer, with the rewrite? Run
#    eb0023ac (aws_port_config.yaml) lost this half to a dropped status request; the rewrite at 10M
#    has not been measured since it was bounded to a cap's width of the key space (vector-store
#    a6cfcf7).
# 2. How far apart are two runs of the same code? The control is eb0023ac's 'default' index again --
#    same code, corpus, phases and, with the AMIs now pinned in the test case, the same images --
#    so its rows against eb0023ac's are a measure of run-to-run noise. Until a few such samples
#    exist, a difference between runs smaller than that noise is not a result.
#
# Both indexes are the port's defaults (no extra options: a 200k cap, the rewrite on, the node
# verifying). Run with the case-sensitive overlay, as eb0023ac and 7212926d were:
#   --config test-cases/substring-search/substring-search-test.yaml
#   --config test-cases/substring-search/stage5-case-sensitive.yaml
#   SCT_SEARCH_TEST_CONFIG=data_dir/latte/substring_search/aws_backfill_config.yaml
# The backfill dataset's directory is the same corpus under another name:
#   ln -s names_10M_long data_dir/latte/substring_search/names_10M_long_backfill
#
# What to read afterwards: the control's rows against eb0023ac's 'default'; for backfill, the size
# row (segments, span columns, 'rewrite_ranges', 'catch_up_secs' -- the build alone), the log's
# "settled ... s after it caught up" (the rewrite), and the query rows against the control's.
#
# Budget: provisioning ~20 min; load and ingest ~18 min; a round of 14 phases ~19 min; the second
# load ~10 min; the build ~4 min and the rewrite, unmeasured at 10M, up to 40; another round ~19
# min; log collection and teardown ~12 min: about 2:00, 2:20 if the rewrite takes its whole budget.
datasets:
  - name: names_10M_long
    index_during_load: true
    max_index_wait_secs: 7200
    max_shard_load_secs: 7200
    max_settle_secs: 1200
    index_variants:
      - label: control
        options: {}
    defaults: &defaults
      limit: 20
      duration: 60s
      concurrency: 64
      rate: 0
      expected_p99_read_ms: 100
    steps:
      - shards: [0..9]
        queries: &queries
          # capacity
          - {set: char1, ordered: true}
          - {set: char2, ordered: true}
          - {set: char2, ordered: true, window: 0.5}
          - {set: char4, ordered: true}
          - {set: char8, ordered: true}
          - {set: char8, ordered: true, window: 0.5}
          - {set: char16, ordered: true}
          - {set: char32, ordered: true}
          - {set: miss, ordered: true}
          # latency, below capacity
          - {set: char2, ordered: true, rate: 2000, concurrency: 16, duration: 60s}
          - {set: char4, ordered: true, rate: 2000, concurrency: 16, duration: 60s}
          - {set: char8, ordered: true, rate: 2000, concurrency: 16, duration: 60s}
          - {set: char16, ordered: true, rate: 1000, concurrency: 16, duration: 60s}
          - {set: char32, ordered: true, rate: 500, concurrency: 16, duration: 60s}

  # The index is created after the load and built by a full scan in token order, so every segment
  # the build leaves spans the whole sort range until the rewrite takes it apart.
  - name: names_10M_long_backfill
    max_index_wait_secs: 7200
    max_shard_load_secs: 7200
    # The default 600 s would start the queries on a half-rewritten index.
    max_settle_secs: 2400
    index_variants:
      - label: backfill
        options: {}
    defaults: *defaults
    steps:
      - shards: [0..9]
        queries: *queries
